<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Movly Watch Party</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff; background: #09070f; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { width: min(520px, 100%); text-align: center; padding: 32px; border: 1px solid #ffffff20; border-radius: 24px; background: #171225; }
    h1 { margin: 0 0 12px; }
    .code { margin: 24px 0; font: 800 clamp(38px, 12vw, 64px)/1 ui-monospace, monospace; letter-spacing: .15em; }
    a { display: inline-block; padding: 13px 20px; border-radius: 999px; color: #fff; background: #7c3aed; text-decoration: none; font-weight: 700; }
    p { color: #c9c3d8; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>Společné sledování v Movly</h1>
    <p>Pozvánka do Watch Party. Připojit se mohou přátelé hostitele s aktivním Premium.</p>
    <div class="code" id="code">······</div>
    <a id="open" href="/">Otevřít v Movly</a>
    <p>Pokud se aplikace neotevře, spusť Movly a zadej zobrazený kód v části Společné sledování.</p>
  </main>
  <script>
    'use strict';
    const match = /^\/party\/([ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6})$/.exec(location.pathname);
    if (!match) {
      document.querySelector('main').textContent = 'Pozvánka nemá platný kód.';
    } else {
      const code = match[1];
      document.getElementById('code').textContent = code;
      document.getElementById('open').href = `movly://party/${code}`;
    }
  </script>
</body>
</html>
